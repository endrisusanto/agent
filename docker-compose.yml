services:
  agent-web-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-web-hub
    restart: unless-stopped
    ports:
      - "${PORT:-4010}:4000"
    volumes:
      - /home/endri-pro/Downloads/CUCIAN:/cucian:ro
      - /run/media/endri-pro/BINARY_HDD/AUTO/Results:/run/media/endri-pro/BINARY_HDD/AUTO/Results:ro
      - /run/media/endri-pro/BINARY_HDD/AUTO:/auto:ro
    environment:
      - PORT=4000
      - AUTO_ROOT=/auto
      - RESULTS_DIR=/auto/Results
      - NODE_ENV=production
